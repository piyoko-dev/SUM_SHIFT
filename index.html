<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SUM SHIFT">
<title>SUM SHIFT | Prototype v0.3.4 Mobile</title>
<style>
:root{color-scheme:dark;--bg:#0e1422;--card:#182235;--tile:#25334b;--ink:#f3f7ff;--muted:#a8b9d3;--blue:#42c5ff;--green:#64e0b0;--pink:#c2a1ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1f3453 0%,var(--bg) 68%);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;min-height:100dvh}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
.app{width:min(100%,480px);margin:auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:.76rem;color:var(--blue);font-weight:800;letter-spacing:.18em}
.subtitle{font-size:.8rem;color:var(--muted);margin-top:6px}
.pill{background:#263853;color:#c9d6ed;border-radius:999px;padding:8px 12px;font-size:.78rem}
.progress{margin-top:16px;display:flex;gap:5px}
.progress>i{height:4px;flex:1;background:#394761;border-radius:9px}
.progress>i.active{background:var(--blue)}
.guide-card{margin-top:18px;padding:18px;background:var(--card);border:1px solid #2c3a54;border-radius:18px;line-height:1.7}
.guide-card .eyebrow{font-size:.72rem;letter-spacing:.1em;color:var(--blue);font-weight:800;margin-bottom:6px}
.guide-title{font-size:1.48rem;margin:0 0 8px}
.guide-lead{color:#d8e6fb;font-size:.96rem;margin:0 0 8px}
.guide-body{color:var(--muted);font-size:.92rem;margin:0;min-height:3.2em}
.game{position:relative;margin-top:18px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{aspect-ratio:1;background:var(--tile);border:2px solid transparent;border-radius:16px;font-size:clamp(28px,9vw,46px);font-weight:750;color:var(--ink);transition:background .2s,border-color .2s,transform .18s;position:relative}
.tile[data-value="0"]{color:#94a8c3}
.tile[data-value="1"]{background:#25415a;color:#81d9ff}
.tile[data-value="2"]{background:#40365d;color:#dfc7ff}
.tile.nudge,.btn.nudge{animation:hintGlow 1.5s ease-in-out infinite;outline:2px solid #79e5ff;outline-offset:2px}
@keyframes hintGlow{0%,100%{box-shadow:0 0 0 0 #42c5ff18}50%{box-shadow:0 0 0 5px #42c5ff55,0 0 22px #42c5ff88}}
.tile.target{border-color:var(--blue);box-shadow:0 0 0 2px #42c5ff33;animation:breathe 1.1s infinite alternate}
.tile.affected{animation:flash .48s ease-out}
.tile.pressed{transform:scale(.91)}
.tile.wrong{animation:shake .27s}
.tile:disabled{opacity:1;cursor:default}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.clear{font-size:clamp(48px,15vw,72px);font-weight:950;letter-spacing:.04em;text-shadow:0 3px 22px #000c,0 0 30px #44e4bf80;color:var(--green);animation:pop 1.25s both}
.clear small{display:block;font-size:.22em;text-align:center;letter-spacing:.08em;color:#fff}
.controls{display:flex;gap:10px;margin-top:14px}
.btn{border:1px solid #39516e;background:#24344c;color:#fff;border-radius:12px;min-height:48px;padding:10px 14px;font-weight:700;flex:1}
.btn.primary{background:#14a4dc;border-color:#14a4dc;color:#071322}
.btn.selected{background:#d5f4ff;color:#092237;border-color:var(--blue)}
.btn.secondary{background:transparent}
.footer{margin-top:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:.83rem}
.footer-actions{display:flex;align-items:center;gap:14px}.footer button{color:#b5dff5;border:0;background:transparent;padding:8px 0}
.footer button:disabled{opacity:.35}.footer button,#levelUndo{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;text-decoration:none;white-space:nowrap}.guide-title:empty,.guide-lead:empty{display:none}.hidden{display:none!important}
@keyframes breathe{to{box-shadow:0 0 0 6px #42c5ff27}}
@keyframes flash{0%{background:#7ce8fa;box-shadow:0 0 23px #42c5ffb0;transform:scale(1.055)}100%{box-shadow:none;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.35);opacity:0}18%{transform:scale(1.14);opacity:1}35%{transform:scale(1)}78%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* v0.2: 本編専用レイアウト */
.view.hidden{display:none!important}.nav-top{margin-top:12px;display:flex;gap:10px}
.nav-top button{font-size:.85rem}.stage-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:18px}
.stage-choice{min-height:82px;border:1px solid #45617c;border-radius:14px;background:#25334b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.stage-choice .number{font-size:1.35rem;font-weight:800}.stage-choice .stars{font-size:.78rem;color:#ffd785;letter-spacing:1px}
.stage-choice.locked{background:#1a2434;color:#8291a7;border-color:#28354c}.stage-choice.locked .stars{color:#8998b0}
.stage-info{font-size:.87rem;color:var(--muted);margin:12px 0}.play-meta{display:flex;justify-content:space-between;gap:8px;color:#cee3ff;font-size:.87rem;margin-top:10px}
.win-card{margin-top:14px;padding:18px;border-radius:18px;background:#173d3d;border:1px solid #427f72;text-align:center}
.win-card h2{font-size:1.6rem;margin:0 0 7px;color:var(--green)}.win-card p{margin:6px 0}.win-stars{font-size:1.8rem;letter-spacing:5px;color:#ffd785}
.game-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.game-actions button{flex:1;min-width:95px}
.menu-btn{border:1px solid #3c5673;background:#24344c;color:#e8f3ff;border-radius:9px;padding:8px 11px;font-size:.85rem}
@media(max-width:390px){.stage-list{gap:6px}.stage-choice{min-height:69px}.stage-choice .number{font-size:1.1rem}.footer{font-size:.75rem}.footer-actions{gap:9px}}
.level-hint{margin-top:12px}.hint-bar{display:flex;align-items:center;gap:12px}.hint-bar .btn{flex:1}.hint-count{font-size:.76rem;color:var(--muted);white-space:nowrap}.hint-detail{margin-top:9px;background:#1a2c42;border:1px solid #36536d;border-radius:13px;padding:13px 15px;line-height:1.65;font-size:.9rem}.hint-detail strong{color:#8cdbff}.hint-detail p{margin:7px 0 12px}.hint-controls{display:flex;gap:8px}.hint-controls .btn{min-height:39px;font-size:.85rem}.hint-controls .btn:disabled{opacity:.38}

/* Ver.0.3: number board is the focal point */
#stagePlayView{min-height:calc(100dvh - 125px);display:flex;flex-direction:column}
#stagePlayView.hidden{display:none}
.play-heading{text-align:center;padding-top:4px}
.play-heading h1{margin:9px 0 5px;font-size:1.35rem;letter-spacing:.07em}
.play-heading p{margin:0;color:var(--muted);font-size:.76rem}
.play-heading .play-meta{justify-content:center;gap:24px;margin-top:10px;font-size:.77rem;color:var(--muted)}
#stagePlayView>.game{margin:auto 0;padding:14px 0}
#levelBoard{max-width:345px;margin:0 auto}
#levelMode{max-width:345px;width:100%;margin:15px auto 0}
#stagePlayView>.game-actions{margin-top:18px;justify-content:center;gap:6px}
#stagePlayView>.game-actions .btn{flex:0 1 auto;min-width:0;min-height:36px;padding:6px 10px;font-size:.72rem;color:#9eafc8;background:transparent;border-color:#2c3b50;font-weight:500}
#stagePlayView .level-hint{margin-top:14px}
#stagePlayView #levelHint{font-size:.78rem;min-height:38px;border-color:#2b3d53}
#tutorialView{position:relative;min-height:calc(100dvh - 175px);display:flex;flex-direction:column;justify-content:center}
#tutorialView.hidden{display:none}
#tutorialView>.game{margin:auto 0;z-index:1}
#tutorialView>.game>.board{max-width:345px;margin:auto}
#tutorialView .guide-card{position:fixed;inset:0;z-index:20;margin:0;border:0;border-radius:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 28px;text-align:center;cursor:pointer}
#tutorialView .guide-card:before{display:none}
#tutorialView .guide-card .eyebrow{display:none}
#tutorialView .guide-card .guide-title{font-size:clamp(24px,7vw,34px);text-shadow:0 2px 8px #000}
#tutorialView .guide-card .guide-lead,#tutorialView .guide-card .guide-body{max-width:360px;color:#f3f7ff;text-shadow:0 2px 8px #000;min-height:0}
.tap-anywhere{font-size:.8rem;letter-spacing:.06em;color:#bceeff;margin-top:24px;animation:breatheText 1.8s ease-in-out infinite}
@keyframes breatheText{50%{opacity:.4}}
#tutorialView .guide-card.nonblocking{position:relative;inset:auto;z-index:2;padding:8px 10px 2px;background:none;cursor:default}
#tutorialView .guide-card.nonblocking:before{display:none}
#tutorialView .guide-card.nonblocking .tap-anywhere{display:none}
#tutorialView .guide-card.nonblocking .guide-title{font-size:1.2rem}
#tutorialView .guide-card.nonblocking .guide-body{font-size:.82rem}
#tutorialView .guide-card.nonblocking .guide-lead{font-size:.86rem}
#tutorialView .guide-card.nonblocking .eyebrow{display:none}
#tutorialView #actions{z-index:2;position:relative}
#tutorialView #primary{display:none!important}
#tutorialView .footer{z-index:2;position:relative}
#tutorialView .progress{margin-bottom:10px}
#tutorialView.controls-focus:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:18;pointer-events:none}
#tutorialView.controls-focus #modeControls{position:relative;z-index:21}
#tutorialView.controls-focus #modeControls .btn{box-shadow:0 0 0 2px #79e5ff55,0 0 22px #42c5ff66;transform:scale(1.01)}
#tutorialView.controls-focus #modeControls{animation:controlsFade 1.25s ease-out both}
@keyframes controlsFade{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:translateY(0)}}
#tutorialView.controls-focus .mode-intro-message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:19;pointer-events:none;padding:25px;text-align:center}
.mode-intro-message .message-inner{max-width:360px;text-shadow:0 3px 12px #000;color:#fff;animation:introTextFade .55s ease-out both}
.mode-intro-message h2{font-size:clamp(26px,7vw,35px);margin:0 0 12px}
.mode-intro-message p{font-size:1rem;line-height:1.8;margin:0}
@keyframes introTextFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stage-clear-tap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.83);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;padding:24px;cursor:pointer;touch-action:manipulation}
.stage-clear-tap h2{font-size:clamp(30px,8vw,43px);color:var(--green);margin:0 0 14px}
.stage-clear-tap .tap-stars{color:#ffd785;font-size:1.8rem;letter-spacing:5px}
.stage-clear-tap .tap-next{color:#bceeff;margin-top:34px;font-size:.88rem;animation:breatheText 1.8s ease-in-out infinite}
@media(max-width:390px){#stagePlayView>.game-actions .btn{font-size:.68rem;padding:6px 8px}}
/* iPhone Safari layout refinements */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent}
@media(max-width:430px){
 .app{padding-left:16px;padding-right:16px}
 .board{gap:7px}
 .tile{border-radius:13px}
 .footer{flex-wrap:wrap;row-gap:6px}
 .footer-actions{margin-left:auto}
 #tutorialView .guide-card{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="brand">SUM SHIFT</div><div class="subtitle">Prototype v0.3.4</div></div><div id="statePill" class="pill">LESSON</div></header>
  <div class="nav-top"><button id="toStages" class="menu-btn" type="button">ステージ選択へ →</button></div>
  <div id="tutorialView" class="view">
  <div id="progress" class="progress" aria-label="チュートリアル進捗"></div>

  <section class="guide-card" id="tutorialGuide" aria-live="polite">
    <div class="eyebrow">GUIDE</div>
    <h1 id="heading" class="guide-title">数字のひみつ</h1>
    <p id="lead" class="guide-lead"></p>
    <div id="guideBody" class="guide-body"></div>
    <p id="tapAnywhere" class="tap-anywhere">画面をタップして続ける ↓</p>
  </section>

  <div class="game">
    <div id="board" class="board" aria-label="3かける3のパズル盤面"></div>
    <div id="overlay" class="overlay" aria-live="polite"></div>
  </div>

  <div id="modeIntroMessage" class="mode-intro-message hidden" aria-live="polite"></div>
  <div id="modeControls" class="controls hidden"><button id="minusBtn" class="btn selected" type="button">−1 操作</button><button id="plusBtn" class="btn" type="button">+1 操作</button></div>
  <div id="actions" class="controls"><button id="primary" class="btn primary" type="button">はじめる →</button><button id="hint" class="btn secondary hidden" type="button">ヒント</button></div>
  <div class="footer"><span id="moves">操作回数：0</span><div class="footer-actions"><button id="back" type="button">一つ戻る ↶</button><button id="reset" type="button">最初からやり直す ↻</button></div></div>
  </div>
  <section id="stageSelectView" class="view hidden">
    <div class="guide-card"><div class="eyebrow">STAGE SELECT</div><h1 class="guide-title">パズルを選ぼう！</h1><p class="guide-lead">01から順番に解放。04は打ち消し合いの練習！</p><p class="guide-body">クリア手数に応じて星を獲得できるよ。何度でも挑戦可能！</p></div>
    <div id="stageList" class="stage-list" aria-label="ステージ一覧"></div>
    <p id="stageSummary" class="stage-info"></p>
    <div class="controls"><button id="backToTutorial" class="btn secondary">チュートリアルに戻る</button></div>
  </section>
  <section id="stagePlayView" class="view hidden">
    <div class="play-heading"><h1 id="levelTitle">STAGE 01</h1><p id="levelDescription">全部0にしよう！</p><div class="play-meta"><span id="levelMoves">操作：0手</span><span id="levelMinimum">最短：1手</span></div></div>
    <div class="game"><div id="levelBoard" class="board" aria-label="ステージ盤面"></div><div id="levelOverlay" class="overlay" aria-live="polite"></div></div>
    <div id="levelMode" class="controls"><button id="levelMinus" class="btn selected" type="button">−1 操作</button><button id="levelPlus" class="btn" type="button">+1 操作</button></div>
    <div id="levelWin" class="win-card hidden" aria-live="polite"><h2>STAGE CLEAR!</h2><div id="levelStars" class="win-stars"></div><p id="levelScore"></p><div class="game-actions"><button id="levelNext" class="btn primary">次のステージ →</button><button id="levelSelect" class="btn secondary">一覧へ戻る</button></div></div>
    <div class="game-actions"><button id="levelUndo" class="btn secondary" type="button">↶ 戻る</button><button id="levelRestart" class="btn secondary" type="button">↻ リセット</button><button id="levelHome" class="btn secondary" type="button">一覧</button></div>
    <section class="level-hint" aria-label="ステージヒント">
      <div class="hint-bar"><button id="levelHint" class="btn secondary" type="button">💡 ヒントを見る（1 / 3）</button><span id="levelHintCount" class="hint-count">未使用</span></div>
      <div id="levelHintPanel" class="hint-detail hidden" aria-live="polite"><strong id="levelHintTitle"></strong><p id="levelHintText"></p><div class="hint-controls"><button id="levelHintPrev" class="btn secondary" type="button">前のヒント</button><button id="levelHintNext" class="btn secondary" type="button">次のヒント</button></div></div>
    </section>
  </section>
  <div id="stageClearTap" class="stage-clear-tap hidden" role="button" tabindex="0" aria-label="次のステージへ進む"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const DEMO = [0,0,0,0,1,0,0,0,0];
const PRACTICE = [0,1,0,1,1,1,0,1,0];
const FREE = [1,1,0,1,0,2,0,2,2];
let board = [...DEMO];
let phase = 'intro';
let direction = -1;
let moves = 0;
let locked = false;
let showHint = false;
let animationHandle = null;
let guidanceTimer = null;
let modeIntroTimer = null;
let modeIntroTextTimer = null;
let history = [];
function saveState(){ history.push({board:[...board],phase,direction,moves,showHint}); }
function cancelGuidance(){ if(guidanceTimer!==null){clearTimeout(guidanceTimer);guidanceTimer=null;} document.querySelectorAll(".nudge").forEach(el=>el.classList.remove("nudge")); }
function cancelModeIntro(){
  if(modeIntroTimer!==null){clearTimeout(modeIntroTimer);modeIntroTimer=null;}
  if(modeIntroTextTimer!==null){clearTimeout(modeIntroTextTimer);modeIntroTextTimer=null;}
}
function scheduleGuidance(){
  cancelGuidance();
  const target = phase === "tap" ? ".tile.target" : ["intro","affected"].includes(phase) ? "#primary" : null;
  if(!target || locked)return;
  guidanceTimer=setTimeout(()=>{ const el=document.querySelector(target);if(el)el.classList.add("nudge");guidanceTimer=null; },5000);
}
function goBack(){
  if(!history.length)return;
  clearAnimation();cancelGuidance();cancelModeIntro();locked=false;
  const prev=history.pop();board=[...prev.board];phase=prev.phase;direction=prev.direction;moves=prev.moves;showHint=prev.showHint;render();
}

function crossing(a,b){ return Math.floor(a/3)===Math.floor(b/3) || a%3===b%3; }
function updateBoard(source,index,delta){ return source.map((value,i)=>crossing(index,i)?(value+delta+3)%3:value); }
function isClear(){ return board.every(value=>value===0); }
function setPhase(value){ phase=value; render(); }
function clearAnimation(){ if(animationHandle!==null){ clearTimeout(animationHandle); animationHandle=null; } $('overlay').innerHTML=''; }
function animateSuccess(label,onEnd){
  $('overlay').innerHTML=`<div class="clear">CLEAR!<small>${label}</small></div>`;
  animationHandle=setTimeout(()=>{ $('overlay').innerHTML=''; animationHandle=null; onEnd(); },1400);
}
function impact(index){
  document.querySelectorAll('.tile').forEach((element,i)=>{
    if(crossing(i,index)){
      element.classList.remove('affected');
      void element.offsetWidth;
      element.classList.add('affected');
    }
  });
}
function wrong(index){
  const tile=document.querySelectorAll('.tile')[index];
  tile.classList.remove('wrong');
  void tile.offsetWidth;
  tile.classList.add('wrong');
  $('lead').textContent='今回は真ん中のマスを押してみよう！';
}
function tap(index){
  if(locked) return;
  if(phase==='tap'){
    if(index!==4){ wrong(index); return; }
    saveState();
    locked=true;
    phase='animating';
    board=updateBoard(board,index,-1);
    render();
    impact(index);
    animateSuccess('操作成功！',()=>{ locked=false; setPhase('affected'); });
    return;
  }
  if(phase!=='practice' && phase!=='free') return;
  const delta = phase==='practice' ? -1 : direction;
  saveState();
  board=updateBoard(board,index,delta);
  moves++;
  render();
  impact(index);
  if(isClear()){
    locked=true;
    const next = phase==='practice' ? 'complete' : 'freeComplete';
    animateSuccess('STAGE CLEAR',()=>{ locked=false; setPhase(next); });
  }
}
function renderBoard(){
  $('board').replaceChildren();
  board.forEach((value,index)=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='tile';
    btn.dataset.value=value;
    btn.textContent=value;
    btn.setAttribute('aria-label',`${Math.floor(index/3)+1}行${index%3+1}列 数字${value}`);
    if(phase==='tap'&&index===4) btn.classList.add('target');
    btn.addEventListener('click',()=>tap(index));
    $('board').appendChild(btn);
  });
}
function render(){
  renderBoard();
  const config={
    intro:{title:'はじめてみよう！',lead:'まずは、数字がどう変化するかを体験しよう。',body:'最終的な目標は、9マスの数字をすべて0にすること。',primary:'はじめる →'},
    tap:{title:'',lead:'中央の「1」をタップしてみよう。',body:'青く光っている真ん中のマスを押してね。',primary:''},
    animating:{title:'操作成功！',lead:'十字のマスが変化したよ。',body:'いま起きた変化を、このあと順番に見ていこう。',primary:''},
    affected:{title:'どこが変わった？',lead:'中央を押すと、縦と横の合計5マスが変化するよ。',body:'<strong>押したマス自身と、上下左右の4マス</strong>が変わったね。斜めのマスは変わらないよ。',primary:'次へ →'},
    neighbors:{title:'周りの数字の変化',lead:'0から1引くと、どうなるかな？',body:'このゲームの数字は <strong>0 → 1 → 2 → 0</strong> と循環するよ。だから上下左右の <strong>0 → 2</strong> になったんだ。',primary:'確認問題へ →'},

    practice:{title:'自分で解いてみよう！',lead:'今度はヒントなしで、全部0にしてみよう。',body:'<strong>−1操作</strong>で、好きなマスをタップしてみてね。'+(showHint?'<br><strong>ヒント：</strong>「1」が十字に並んでいるよ。':''),primary:''},
    complete:{title:'確認問題クリア！',lead:'自分でルールを使って解けたね。',body:`<strong>${moves}手でクリア！</strong> 次は+1も使える自由プレイに挑戦できるよ。`,primary:'次の問題へ →'},
    modeIntro:{title:'',lead:'',body:'',primary:''},
    free:{title:'2手問題に挑戦！',lead:'今度は「+1」と「−1」の両方を使おう。',body:'方向を選んでマスを押そう。すべて0にすればクリア！'+(showHint?'<br><strong>ヒント：</strong>左上に−1、右下に+1を1回ずつ。':''),primary:''},
    freeComplete:{title:'クリア！',lead:'SUM SHIFTの基本操作はマスターしたね。',body:`<strong>${moves}手でクリア！</strong> この問題は最短2手で解けるよ。`,primary:'本編ステージへ →'}
  }[phase];

  const narrative=['intro','affected','neighbors','complete','freeComplete'].includes(phase);
  $('tutorialGuide').classList.toggle('nonblocking',!narrative);
  $('tutorialGuide').classList.toggle('hidden',phase==='modeIntro');
  $('tapAnywhere').classList.toggle('hidden',!narrative);
  $('tutorialView').classList.toggle('controls-focus',phase==='modeIntro');
  if(phase!=='modeIntro'){$('modeIntroMessage').classList.add('hidden');$('modeIntroMessage').replaceChildren();}
  $('heading').textContent=config.title;
  $('lead').textContent=config.lead;
  $('guideBody').innerHTML=config.body;
  $('primary').textContent=config.primary;
  $('primary').classList.toggle('hidden',!config.primary);
  $('hint').classList.toggle('hidden',phase!=='practice'&&phase!=='free');
  $('hint').textContent=showHint?'ヒントを閉じる':'ヒントを見る';
  $('modeControls').classList.toggle('hidden',!(phase==='free' || phase==='modeIntro'));
  $('minusBtn').classList.toggle('selected',direction===-1);
  $('plusBtn').classList.toggle('selected',direction===1);
  $('moves').textContent=`操作回数：${moves}`;
  $('statePill').textContent=['practice','complete','free','freeComplete'].includes(phase)?'PLAY':'LESSON';

  const progressMap={intro:0,tap:1,animating:1,affected:2,neighbors:3,practice:4,complete:4,modeIntro:5,free:5,freeComplete:5};
  const progressIndex=progressMap[phase] ?? 0;
  $('progress').innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<=progressIndex?'active':''}"></i>`).join('');
  $('back').disabled=history.length===0 || phase==='modeIntro';
  cancelModeIntro();
  if(phase==='modeIntro'){
    locked=true;
    // First let the two controls fade in; only then display the problem text.
    modeIntroTextTimer=setTimeout(()=>{
      modeIntroTextTimer=null;
      if(page!=='tutorial'||phase!=='modeIntro')return;
      $('modeIntroMessage').innerHTML='<div class="message-inner"><h2>2手問題に挑戦！</h2><p>「−1」と「+1」を使い分けて、すべて0にしよう！</p></div>';
      $('modeIntroMessage').classList.remove('hidden');
    },1250);
    modeIntroTimer=setTimeout(()=>{
      modeIntroTimer=null;
      if(page!=='tutorial'||phase!=='modeIntro')return;
      locked=false;setPhase('free');
    },3500);
  }
  scheduleGuidance();
}
function advanceGuide(){
  if(locked) return;
  if(phase==='intro'){saveState();setPhase('tap');}
  else if(phase==='affected'){saveState();setPhase('neighbors');}
  else if(phase==='neighbors'){saveState(); board=[...PRACTICE]; moves=0; showHint=false; setPhase('practice'); }
  else if(phase==='complete'){saveState(); board=[...FREE]; moves=0; showHint=false; direction=-1; setPhase('modeIntro'); }
  else if(phase==='freeComplete') navigate('select');
}
$('tutorialGuide').addEventListener('click',()=>{if(!locked && ['intro','affected','neighbors','complete','freeComplete'].includes(phase))advanceGuide()});
$('primary').addEventListener('click',advanceGuide);
$('minusBtn').addEventListener('click',()=>{ direction=-1; render(); });
$('plusBtn').addEventListener('click',()=>{ direction=1; render(); });
$('hint').addEventListener('click',()=>{ showHint=!showHint; render(); });
function restart(){ clearAnimation();cancelGuidance();cancelModeIntro();history=[]; locked=false; board=[...DEMO]; moves=0; showHint=false; direction=-1; setPhase('intro'); }
$('reset').addEventListener('click',restart);
$('back').addEventListener('click',goBack);

// ==========================================
// Ver.0.2 本編：ステージとクリア記録
// ==========================================
const STAGES = [{"board":[1,1,1,1,0,0,1,0,0],"min":1},{"board":[2,2,2,1,1,0,1,1,0],"min":2},{"board":[0,0,0,1,1,1,1,1,1],"min":3},{"board":[0,0,0,2,1,0,2,1,0],"min":2,"lesson":"cancel"},{"board":[0,0,2,0,1,2,1,2,2],"min":3},{"board":[1,0,0,2,2,2,2,1,1],"min":4},{"board":[2,1,2,0,2,1,1,1,1],"min":5},{"board":[1,1,2,2,1,1,0,2,2],"min":6},{"board":[2,2,2,2,1,2,1,0,1],"min":7},{"board":[1,1,2,1,1,0,1,2,1],"min":7},{"board":[1,2,1,1,1,2,0,2,2],"min":8}];
// 本編ステージの3段階ヒント。どのヒントも正解マスや操作列は表示しません。
const STAGE_HINTS = [
  [
    "数字1を0にする方法を思い出してみよう。",
    "同じ縦・横にある数字が、まとめて変わるよ。",
    "十字になっている数字に注目。1回でまとめて動かせないかな？"
  ],
  [
    "一度に全部0にならなくても大丈夫。",
    "ひとつの操作は縦と横の5マスに影響するよ。",
    "どの数字が何回変化するかを、少しずつ数えてみよう。"
  ],
  [
    "数字の変化は 0→1→2→0 の繰り返し。",
    "同じ場所に別々の操作の影響が重なることもあるよ。",
    "1マスずつ消すより、複数の操作を組み合わせて考えてみよう。"
  ],
  [
    "2つの操作が同じ場所に重なったときの数字を見てみよう。",
    "＋1と−1が両方当たったマスはどうなるかな？",
    "＋1と−1は互いに打ち消し合うよ。重なる部分を先に見つけて、残った変化だけを考えよう。"
  ],
  [
    "途中で数字が増えても、失敗とは限らないよ。",
    "行と列をそれぞれ見て、似た並びを探してみよう。",
    "操作する順番より、最終的に何回影響するかが大切だよ。"
  ],
  [
    "目先の0だけを守ろうとしなくてもいいよ。",
    "同じ行に並ぶ数字を見比べてみよう。",
    "一度の操作で変わる5マスを意識して、最後の形から逆算してみよう。"
  ],
  [
    "数字が不規則でも、押す回数の組み合わせには法則があるよ。",
    "まず左列と右列の数字を見比べよう。",
    "同じ列の別のマスを操作すると、列内の影響は重なり、ほかの列には別々に伝わる。変化の打ち消しを考えよう。"
  ],
  [
    "見た目の数字だけでなく、各マスが何回影響を受けるか考えよう。",
    "最上段と最下段では数字の並びが違うね。",
    "同じ行の3マスへの操作を組み合わせると、その行への効果を残さず、ほかの行だけを変えられる場合があるよ。"
  ],
  [
    "『2』は＋1でも−1を2回でも0にできるよ。",
    "中央の行には2が多く、下の行には0と1があるね。",
    "押すマスと交わる列にも影響が残る。まず一つの列で必要な変化を数え、次に行への影響と合わせよう。"
  ],
  [
    "全部の数字を一度に追わず、隣り合う数字の差を比べてみよう。",
    "上段と下段には似た数字があるのに、中段は違うね。",
    "同じ行の2マスの差は、その2つの列に対する操作の差から生まれるよ。数字の差を手がかりにしよう。"
  ],
  [
    "操作回数が増えても、同じマスに＋1と−1を重ねる必要はないよ。",
    "上段に1が多く、下段には0と2が混ざっているね。",
    "行ごとの操作の合計と、列ごとの操作の合計を別々に考えよう。最後は両方の影響を足して数字を0にできるよ。"
  ]
];
const HINT_TITLES=['ヒント①｜考え方','ヒント②｜注目する場所','ヒント③｜解き方のコツ'];
let levelHintStep=0;
const SAVE_KEY = 'sumshift_v030_progress';
const PREVIOUS_SAVE_KEY = 'sumshift_v023_progress';
const OLD_SAVE_KEY = 'sumshift_v02_progress';
let progressData = loadProgress();
let page = 'tutorial';
let selectedLevel = 0;
let levelBoard = [];
let levelDirection = -1;
let levelHistory = [];
let levelMovesCount = 0;
let levelAnimating = false;
let levelTimer = null;
function loadProgress(){
  try {const v=JSON.parse(localStorage.getItem(SAVE_KEY));if(v&&Array.isArray(v.stars)&&v.stars.length===STAGES.length)return {stars:v.stars.map(n=>Math.max(0,Math.min(3,Number(n)||0)))}}catch(e){}
  // Stage 04 is a new lesson, so carry forward only stages 01-03.
  for(const key of [PREVIOUS_SAVE_KEY,OLD_SAVE_KEY]){
    try {const old=JSON.parse(localStorage.getItem(key));if(old&&Array.isArray(old.stars))return {stars:STAGES.map((_,i)=>i<3?Math.max(0,Math.min(3,Number(old.stars[i])||0)):0)}}catch(e){}
  }
  return {stars:Array(STAGES.length).fill(0)};
}
function storeProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(progressData))}catch(e){}}
function stopLevelFx(){if(levelTimer!==null){clearTimeout(levelTimer);levelTimer=null;}levelAnimating=false;$('levelOverlay').replaceChildren();}
function navigate(where){
  stopLevelFx();cancelGuidance();cancelModeIntro();$('stageClearTap').classList.add('hidden');if(where!=='tutorial'){clearAnimation();locked=false;if(phase==='animating'){phase='tap';board=[...DEMO];}}page=where;
  $('tutorialView').classList.toggle('hidden',where!=='tutorial');
  $('stageSelectView').classList.toggle('hidden',where!=='select');
  $('stagePlayView').classList.toggle('hidden',where!=='play');
  $('toStages').classList.toggle('hidden',where!=='tutorial');
  $('statePill').textContent=where==='tutorial'?'LESSON':where==='select'?'STAGES':'PLAY';
  if(where==='tutorial'){render();}else if(where==='select'){renderStageSelect();}else{renderLevel();}
}
function isUnlocked(i){return i===0||progressData.stars[i-1]>0;}
function renderStageSelect(){
  $('stageList').replaceChildren();
  STAGES.forEach((stage,i)=>{
    const btn=document.createElement('button');btn.type='button';btn.className='stage-choice'+(isUnlocked(i)?'':' locked');btn.disabled=!isUnlocked(i);
    btn.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span class="stars">${!isUnlocked(i)?'🔒':progressData.stars[i]?'★'.repeat(progressData.stars[i])+'☆'.repeat(3-progressData.stars[i]):'☆☆☆'}</span>`;
    btn.setAttribute('aria-label',`ステージ${i+1} ${isUnlocked(i)?'選択可能':'ロック中'}`);
    btn.addEventListener('click',()=>startLevel(i));$('stageList').appendChild(btn);
  });
  $('stageSummary').textContent=`クリア済み ${progressData.stars.filter(x=>x>0).length} / ${STAGES.length} ステージ　｜　獲得スター ${progressData.stars.reduce((a,b)=>a+b,0)} / ${STAGES.length*3}`;
}
function startLevel(index){
  if(!isUnlocked(index))return;
  selectedLevel=index;levelBoard=[...STAGES[index].board];levelDirection=-1;levelHistory=[];levelMovesCount=0;levelHintStep=0;stopLevelFx();navigate('play');
}
function isLevelClear(){return levelBoard.every(n=>n===0)}
function renderLevel(){
  const stage=STAGES[selectedLevel];
  $('levelTitle').textContent=`STAGE ${String(selectedLevel+1).padStart(2,'0')}`;
  $('levelDescription').textContent=selectedLevel===0?'最初は1手！すべて0にしよう。':selectedLevel===3?'打ち消し合いを体験！ ＋1と−1で2手クリアを目指そう。':selectedLevel===STAGES.length-1?'最後の難問に挑戦！最短手数を目指そう。':'+1と−1を使い分け、すべて0にしよう。';
  $('levelMoves').textContent=`操作：${levelMovesCount}手`;
  $('levelMinimum').textContent=`最短：${stage.min}手`;
  renderLevelHint();
  $('levelMinus').classList.toggle('selected',levelDirection===-1);
  $('levelPlus').classList.toggle('selected',levelDirection===1);
  $('levelUndo').disabled=levelHistory.length===0||levelAnimating;
  $('levelBoard').replaceChildren();
  levelBoard.forEach((n,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tile';b.dataset.value=n;b.textContent=n;b.disabled=levelAnimating||isLevelClear();
    b.setAttribute('aria-label',`${Math.floor(i/3)+1}行${i%3+1}列 数字${n}`);b.addEventListener('click',()=>tapLevel(i));$('levelBoard').appendChild(b);
  });
  const cleared=isLevelClear();
  $('levelMode').classList.toggle('hidden',cleared);
  $('levelWin').classList.toggle('hidden',!cleared||levelAnimating);
  $('levelNext').classList.add('hidden');
  $('levelWin').classList.add('hidden');
  const clearTap=$('stageClearTap');
  clearTap.classList.toggle('hidden',!cleared||levelAnimating);
  if(cleared&&!levelAnimating){
    const stars=scoreStars(levelMovesCount,stage.min);
    clearTap.innerHTML=`<h2>STAGE CLEAR!</h2><div class="tap-stars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><p>${levelMovesCount}手でクリア！ 最短：${stage.min}手</p><div class="tap-next">${selectedLevel<STAGES.length-1?'画面をタップして次のステージへ ↓':'画面をタップしてステージ一覧へ ↓'}</div>`;
  }
  if(cleared&&!levelAnimating){
    const stars=scoreStars(levelMovesCount,stage.min);
    $('levelStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    $('levelScore').textContent=`${levelMovesCount}手でクリア！ 最短手数：${stage.min}手`;
  }
}
function renderLevelHint(){
  const visible=levelHintStep>0;
  $('levelHintPanel').classList.toggle('hidden',!visible);
  $('levelHintCount').textContent=visible?`${levelHintStep} / 3 表示中`:'未使用';
  $('levelHint').textContent=visible?'💡 ヒントを閉じる':'💡 ヒントを見る（1 / 3）';
  if(visible){
    $('levelHintTitle').textContent=HINT_TITLES[levelHintStep-1];
    $('levelHintText').textContent=STAGE_HINTS[selectedLevel][levelHintStep-1];
  }
  $('levelHintPrev').disabled=levelHintStep<=1;
  $('levelHintNext').disabled=levelHintStep>=3;
}
function scoreStars(used,min){return used===min?3:used<=min+2?2:1;}
function tapLevel(index){
  if(page!=='play'||levelAnimating||isLevelClear())return;
  levelHistory.push([...levelBoard]);
  levelBoard=updateBoard(levelBoard,index,levelDirection);levelMovesCount++;
  const clear=isLevelClear();
  if(clear){
    levelAnimating=true;
    const score=scoreStars(levelMovesCount,STAGES[selectedLevel].min);
    progressData.stars[selectedLevel]=Math.max(progressData.stars[selectedLevel],score);storeProgress();
  }
  renderLevel();
  $('levelBoard').querySelectorAll('.tile').forEach((b,i)=>{if(crossing(i,index)){b.classList.add('affected')}});
  if(clear){
    $('levelOverlay').innerHTML='<div class="clear">CLEAR!<small>STAGE CLEAR</small></div>';
    levelTimer=setTimeout(()=>{levelAnimating=false;levelTimer=null;$('levelOverlay').replaceChildren();if(page==='play')renderLevel();},1400);
  }
}
$('toStages').addEventListener('click',()=>navigate('select'));
$('backToTutorial').addEventListener('click',()=>navigate('tutorial'));
$('levelHome').addEventListener('click',()=>navigate('select'));
$('levelSelect').addEventListener('click',()=>navigate('select'));
$('levelNext').addEventListener('click',()=>{if(selectedLevel<STAGES.length-1)startLevel(selectedLevel+1)});
function advanceStageClear(){
  if(page!=='play'||levelAnimating||!isLevelClear())return;
  if(selectedLevel<STAGES.length-1)startLevel(selectedLevel+1);else navigate('select');
}
$('stageClearTap').addEventListener('click',advanceStageClear);
$('stageClearTap').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advanceStageClear();}});
$('levelRestart').addEventListener('click',()=>startLevel(selectedLevel));
$('levelUndo').addEventListener('click',()=>{
  if(levelAnimating||!levelHistory.length)return;
  levelBoard=levelHistory.pop();levelMovesCount--;renderLevel();
});
$('levelHint').addEventListener('click',()=>{levelHintStep=levelHintStep===0?1:0;renderLevelHint();});
$('levelHintPrev').addEventListener('click',()=>{if(levelHintStep>1){levelHintStep--;renderLevelHint();}});
$('levelHintNext').addEventListener('click',()=>{if(levelHintStep>0&&levelHintStep<3){levelHintStep++;renderLevelHint();}});
$('levelMinus').addEventListener('click',()=>{levelDirection=-1;renderLevel()});
$('levelPlus').addEventListener('click',()=>{levelDirection=1;renderLevel()});

render();
</script>
